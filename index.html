<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>沖繩七日行程</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#12293A;
  --navy-deep:#0B1C28;
  --paper:#FAF6EC;
  --paper-card:#FFFFFF;
  --reef:#2E8C8A;
  --reef-dark:#1D5C5B;
  --tile:#B5502D;
  --tile-dark:#7C3719;
  --gold:#CE9B3F;
  --line:#E4DCC8;
  --text-main:#1F2A2E;
  --text-sub:#5E6C6E;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--paper);
  color:var(--text-main);
  font-family:'Noto Sans TC',sans-serif;
  padding-bottom:60px;
}
.hero{
  background:linear-gradient(180deg,var(--navy) 0%,var(--navy-deep) 100%);
  color:#EFE7D2;
  padding:36px 20px 46px;
  position:relative;
  overflow:hidden;
}
.hero::after{
  content:"";
  position:absolute;
  left:0;right:0;bottom:-1px;height:36px;
  background:var(--paper);
  clip-path:polygon(0 60%,5% 45%,10% 60%,15% 40%,20% 60%,25% 42%,30% 60%,35% 45%,40% 60%,45% 40%,50% 60%,55% 45%,60% 60%,65% 40%,70% 60%,75% 45%,80% 60%,85% 42%,90% 60%,95% 45%,100% 60%,100% 100%,0 100%);
}
.hero-eyebrow{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  letter-spacing:2px;
  color:var(--gold);
  text-transform:uppercase;
}
.hero h1{
  font-family:'Shippori Mincho',serif;
  font-size:34px;
  font-weight:700;
  margin:8px 0 4px;
}
.hero p{
  margin:0;
  color:#B9C4C6;
  font-size:14px;
}
.hero-meta{
  display:flex;
  gap:18px;
  margin-top:18px;
  flex-wrap:wrap;
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  color:#DCCE9E;
}
.hero-meta span b{color:#fff;font-weight:500;}

.currency-toggle{
  position:sticky;
  top:0;
  z-index:20;
  background:var(--paper);
  border-bottom:1px solid var(--line);
  padding:10px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.day-nav{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding-bottom:2px;
  flex:1;
}
.day-nav::-webkit-scrollbar{height:4px;}
.day-pill{
  flex:none;
  border:1px solid var(--line);
  background:var(--paper-card);
  color:var(--text-sub);
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  padding:6px 10px;
  border-radius:20px;
  cursor:pointer;
  white-space:nowrap;
}
.day-pill.today{border-color:var(--tile);color:var(--tile-dark);font-weight:500;}
.day-pill.active{background:var(--navy);color:#EFE7D2;border-color:var(--navy);}

.cur-switch{
  flex:none;
  display:flex;
  border:1px solid var(--line);
  border-radius:20px;
  overflow:hidden;
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
}
.cur-switch button{
  border:none;
  background:var(--paper-card);
  padding:6px 12px;
  cursor:pointer;
  color:var(--text-sub);
}
.cur-switch button.on{background:var(--reef);color:#fff;}

.wrap{max-width:760px;margin:0 auto;padding:0 20px;}

.summary{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:10px;
  margin:22px 0;
}
.sum-card{
  background:var(--paper-card);
  border:1px solid var(--line);
  border-radius:12px;
  padding:14px 16px;
}
.sum-label{font-size:12px;color:var(--text-sub);}
.sum-value{font-family:'JetBrains Mono',monospace;font-size:19px;margin-top:4px;color:var(--tile-dark);}

.day{
  margin-top:26px;
  scroll-margin-top:70px;
}
.day-head{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:12px;
}
.stamp{
  flex:none;
  width:52px;height:52px;
  border-radius:50%;
  border:2px solid var(--tile);
  color:var(--tile-dark);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:'JetBrains Mono',monospace;
  transform:rotate(-4deg);
}
.stamp .n{font-size:18px;font-weight:500;line-height:1;}
.stamp .w{font-size:9px;letter-spacing:1px;}
.day-head h2{
  font-family:'Shippori Mincho',serif;
  font-size:19px;
  margin:0;
  color:var(--navy);
}
.day-head .date{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  color:var(--text-sub);
}

.card{
  background:var(--paper-card);
  border:1px solid var(--line);
  border-radius:12px;
  padding:16px 18px;
  margin-bottom:10px;
}
.card h3{
  margin:0 0 8px;
  font-size:13px;
  color:var(--reef-dark);
  display:flex;align-items:center;gap:6px;
  font-weight:500;
  text-transform:uppercase;
  letter-spacing:1px;
}
.plan-line{
  white-space:pre-line;
  font-size:14px;
  line-height:1.8;
  color:var(--text-main);
}
.hotel-name{font-size:16px;font-weight:500;color:var(--navy);margin:2px 0;}
.hotel-name a{color:var(--navy);text-decoration:none;border-bottom:1px dotted var(--navy);}
.hotel-meta{
  display:flex;
  gap:16px;
  flex-wrap:wrap;
  margin-top:8px;
  font-size:12px;
  color:var(--text-sub);
  font-family:'JetBrains Mono',monospace;
}
.hotel-meta b{color:var(--text-main);}
.price-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:12px;
  padding-top:10px;
  border-top:1px solid var(--line);
}
.price-label{font-size:12px;color:var(--text-sub);}
.price-val{font-family:'JetBrains Mono',monospace;font-size:18px;color:var(--tile-dark);}
.price-sub{font-size:11px;color:var(--text-sub);font-family:'JetBrains Mono',monospace;}
.map-btn{
  display:inline-flex;
  align-items:center;
  gap:6px;
  margin-top:10px;
  font-size:12px;
  color:#fff;
  background:var(--reef);
  padding:7px 12px;
  border-radius:20px;
  text-decoration:none;
}
.no-hotel{font-size:13px;color:var(--text-sub);font-style:italic;}
.footnote{
  text-align:center;
  color:var(--text-sub);
  font-size:11px;
  margin-top:36px;
  font-family:'JetBrains Mono',monospace;
}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-eyebrow">Okinawa · 沖繩自由行</div>
  <h1>七夜八日 行程手帳</h1>
  <p>那覇 · 美國村 · 名護 · 本部 · 古宇利島</p>
  <div class="hero-meta">
    <span>日期 <b>07/18 – 07/26</b></span>
    <span>去程 <b>IT288 10:10→13:00</b></span>
    <span>回程 <b>IT289 21:40→22:30</b></span>
    <span>隨身行李 <b>10kg</b></span>
  </div>
</div>

<div class="currency-toggle">
  <div class="day-nav" id="dayNav"></div>
  <div class="cur-switch">
    <button id="btnTWD" class="on">TWD</button>
    <button id="btnJPY">JPY</button>
  </div>
</div>

<div class="wrap">

  <div class="summary">
    <div class="sum-card">
      <div class="sum-label">機票總額</div>
      <div class="sum-value" data-twd="22948" data-jpy="107702">NT$22,948</div>
    </div>
    <div class="sum-card">
      <div class="sum-label">飯店總額（估）</div>
      <div class="sum-value" data-twd="37943.63" data-jpy="177963">NT$37,944</div>
    </div>
    <div class="sum-card">
      <div class="sum-label">租車 / 交通</div>
      <div class="sum-value" data-twd="7200" data-jpy="33780">NT$7,200</div>
    </div>
    <div class="sum-card">
      <div class="sum-label">住宿天數</div>
      <div class="sum-value">7 晚</div>
    </div>
  </div>

  <div id="days"></div>

  <div class="footnote">
    匯率估算：1 TWD ≈ 4.69 JPY（僅供參考，實際請以當日匯率為準）· sim卡 / 日文駕照本＋台灣駕照 / 身分證 請隨身攜帶
  </div>

</div>

<script>
const RATE = 4.69; // 1 TWD ≈ 4.69 JPY

const days = [
  {
    n:1, date:"07/18", week:"六", title:"那覇市｜識名園・識名宮",
    plan:"07:00 機場接送\n07:30 KHH AIRPORT\n13:00 OKA AIRPORT\n14:00 大同租車\n14:30 午餐（通堂拉麵）\n15:30 識名園(0900~1800)(P)、識名宮(P)\n　　　壺屋 yachimun 通、榮町市場\n晚餐：Nakamuraya Naha(沖繩麵)、傑克牛排",
    spots:"識名園 · 識名宮",
    hotel:{name:"Route Inn Grantia 那覇（雙人房兩間）",nameEn:"Route Inn Grantia Naha",checkin:"15:00",checkout:"11:00",twd:3673,jpy:3673*RATE,area:"那覇市"},
    transport:"租車（大同租車機場營業所）",
    ticket:{label:"交通押金 / 相關費用",twd:7200,jpy:7200*RATE}
  },
  {
    n:2, date:"07/19", week:"日", title:"美國村｜首里城・波上宮",
    plan:"飯店早餐(6:30~9:30)\n09:00 波上宮(0900~1700)(P)\n10:00 首里城(玉陵)(金城村屋)(0830~1800)(P~1800)\nPARCO CITY\n港川外人住宅區(雞湯薑麵屋 石工夫)\n午餐：雞湯薑麵屋 石工夫 or MY HOUSE OR BLUE SEAL OR A&W\n普天滿宮(0900~1700)\n晚餐：美國村 OR 浜屋沖繩麵(~1730)\nAEON MALL(10-22)",
    spots:"波上宮 · 首里城 · 港川外人住宅區 · 普天滿宮",
    hotel:{name:"瑞康水晶飯店（四人房）（兩天）",nameEn:"Rycom Crystal Hotel",checkin:"16:00",checkout:"11:00",twd:5321.09,jpy:5321.09*RATE,area:"美國村"},
    ticket:null
  },
  {
    n:3, date:"07/20", week:"一", title:"鐘乳石洞｜中城城跡・勝連城跡",
    plan:"中城城跡(0830~1700)\n中村家住宅(0900~1700)\nPloughman's Lunch Bakery(0900~1600)\n普天滿宮(0900~1730)\n泡瀬漁港\n勝連城跡(0900~1800)\nKING TACOS 與勝店、比屋根店、あげな店\n海中道路（海中茶屋）\n平安座島\n宮城島（製鹽工廠、果報崖）\n濱比嘉島(Muruku 海濱、Shirumichu、Amamichu、古民家食堂)\nAEON MALL(10-22)",
    spots:"中城城跡 · 中村家住宅 · 勝連城跡 · 海中道路 · 濱比嘉島",
    hotel:null,
    ticket:null
  },
  {
    n:4, date:"07/21", week:"二", title:"萬座毛｜海中參觀・名護酒廠",
    plan:"座喜味城跡(24hr)\n殘波岬(0930~1730)\n琉球村(0930~1700)\n恩納村博物館(09:00~17:00)\n午餐：SEA SIDE DRIVE-IN\nCAVE OKINAWA(0900~1830)\nFOREST CAFÉ(0900~1730)",
    spots:"萬座毛 · 海中參觀 · 名護酒廠 · 座喜味城跡 · 殘波岬 · 琉球村",
    hotel:{name:"ANA 皇冠假日度假飯店（兩間雙人房）",nameEn:"ANA Crowne Plaza Resort Okinawa",checkin:"15:00",checkout:"12:00",twd:7685.54,jpy:7685.54*RATE,area:"名護"},
    ticket:null
  },
  {
    n:5, date:"07/22", week:"三", title:"海生館｜瀬底島・今歸仁城",
    plan:"飯店早餐\n萬座毛(08:00~20:00)\n海中塔(09:00~17:00)、玻璃船(09:10~16:10)\n許田休息站\n15:00（已預約）ORION BEER\n21世紀之森海灘（星巴克）",
    spots:"海生館 · 瀬底島 · 今歸仁城",
    hotel:{name:"本部綠花園飯店（雙人房）（兩天）",nameEn:"Motobu Green Park Hotel",checkin:"15:00",checkout:"10:00",twd:8456,jpy:8456*RATE,area:"今歸仁"},
    ticket:null
  },
  {
    n:6, date:"07/23", week:"四", title:"古宇利島｜勝連城跡・泡瀬漁港",
    plan:"星巴克 沖繩本部町店(07:00~22:00)\n美麗海水族館(08:30~18:30)\n午餐：觀景餐廳 INOH(11:00~4:00)\n滿潮福木步道、海灘\n今歸仁城(08:00~18:00)",
    spots:"古宇利島 · 勝連城跡 · 泡瀬漁港",
    hotel:null,
    ticket:{label:"美麗海水族館觀景餐廳 INOH 午餐",twd:null,jpy:null}
  },
  {
    n:7, date:"07/24", week:"五", title:"那覇市｜心形岩・古宇利大橋",
    plan:"、始まりの洞窟、心形岩\n屋我地島 大橋南端觀景台\nDRIVE IN 里卡里卡沃(1000~1700)\nMatsuda Mega Gama Cave（要預約）\n勝連城跡(0800~1800)\n（泡瀬漁港）\n奧武山公園(06-22可免費停車)",
    spots:"始まりの洞窟 · 心形岩 · 屋我地島大橋南端觀景台 · 勝連城跡",
    hotel:{name:"沖繩海景飯店",nameEn:"Okinawa Harborview Hotel",checkin:"14:00",checkout:"11:00",twd:6740,jpy:6740*RATE,area:"那覇市"},
    transport:"停奧武山公園 OR D-Parking 那覇壺川1丁目第1駐車場(20~08 300YEN)",
    ticket:{label:"晚餐：JEF YONABARU / MAIKAI（巴西碳燒蝦飯）/ Shimabutaya Tonkatsu / 拉麵天國",twd:null,jpy:null}
  },
  {
    n:8, date:"07/25", week:"六", title:"那覇市｜Gangala之谷・玉泉洞",
    plan:"飯店早餐\n奧武山公園\n10:00 or 12:00 Gangala之谷(09~16)（要預約）\n玉泉洞(09~16)（毒蛇秀 11:30、13:30、15:30；太鼓秀 10:30、12:30、14:30）\nCYURA島餐廳(玉泉洞吃到飽)\n齋場御嶽(0900~1715)\n知念岬\n奧武島天婦羅三間天婦羅(~1745)\nCOSTCO\n琉球館(0930~1730)\n晚餐：EGG ME TIME、Shimabutaya豬排、donkatsu uchiyaji",
    spots:"Gangala 之谷 · 玉泉洞 · 齋場御嶽 · 知念岬 · 奧武島",
    hotel:{name:"拉‧潔特 沖繩那覇飯店",nameEn:"La'gent Hotel Okinawa Naha",checkin:"15:00",checkout:"11:00",twd:5808,jpy:5808*RATE,area:"那覇市"},
    ticket:null
  },
  {
    n:9, date:"07/26", week:"日", title:"回程日｜奧特萊斯・瀬長島",
    plan:"飯店早餐\n琉球館(0930~1730)\nOUTLET\nDMM水族館\n瀬長島幸福鬆餅(11-21)\n17:00 還車\n機場JCB貴賓室（管制區外）\n19:30 CHECK IN\n22:30 機場接送\n21:40 起飛",
    spots:"OUTLET · DMM水族館 · 瀬長島",
    hotel:null,
    ticket:null
  }
];

function fmtTWD(v){ return v==null ? "—" : "NT$"+Math.round(v).toLocaleString(); }
function fmtJPY(v){ return v==null ? "—" : "¥"+Math.round(v).toLocaleString(); }

let currency = "TWD";

function renderNav(){
  const nav = document.getElementById("dayNav");
  const todayStr = new Date().toISOString().slice(5,10).replace("-","/");
  nav.innerHTML = days.map(d=>{
    const isToday = d.date === todayStr;
    return `<button class="day-pill${isToday?" today":""}" data-target="day-${d.n}">${d.date} ${d.week}${isToday?" ・今天":""}</button>`;
  }).join("");
  nav.querySelectorAll(".day-pill").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      document.getElementById(btn.dataset.target).scrollIntoView({behavior:"smooth", block:"start"});
    });
  });
}

function renderDays(){
  const root = document.getElementById("days");
  root.innerHTML = days.map(d=>{
    let hotelHtml = `<div class="no-hotel">本日無新入住飯店（延續前一晚住宿或當日返程）</div>`;
    if(d.hotel){
      const mapQuery = encodeURIComponent(d.hotel.nameEn + " " + d.hotel.area + " Okinawa");
      hotelHtml = `
        <div class="hotel-name">${d.hotel.name}<br><span style="font-size:12px;color:var(--text-sub);font-weight:400;">${d.hotel.nameEn}</span></div>
        <div class="hotel-meta">
          <span>入住 <b>${d.hotel.checkin}</b></span>
          <span>退房 <b>${d.hotel.checkout}</b></span>
          <span>區域 <b>${d.hotel.area}</b></span>
        </div>
        <a class="map-btn" href="https://www.google.com/maps/search/?api=1&query=${mapQuery}" target="_blank" rel="noopener">
          在 Google 地圖開啟位置
        </a>
        <div class="price-row">
          <div>
            <div class="price-label">房價估算</div>
            <div class="price-sub">＝ ${fmtTWD(d.hotel.twd)} ｜ ${fmtJPY(d.hotel.jpy)}</div>
          </div>
          <div class="price-val cur-price" data-twd="${d.hotel.twd}" data-jpy="${d.hotel.jpy}">${currency==="TWD"?fmtTWD(d.hotel.twd):fmtJPY(d.hotel.jpy)}</div>
        </div>`;
    }

    let ticketHtml = "";
    if(d.ticket){
      ticketHtml = `
        <div class="card">
          <h3><i>券</i> 門票 / 餐飲估價</h3>
          <div class="plan-line">${d.ticket.label}</div>
          ${d.ticket.twd!=null ? `<div class="price-row"><div class="price-label">估算</div><div class="price-val cur-price" data-twd="${d.ticket.twd}" data-jpy="${d.ticket.jpy}">${currency==="TWD"?fmtTWD(d.ticket.twd):fmtJPY(d.ticket.jpy)}</div></div>` : `<div class="price-sub" style="margin-top:8px;">尚未記錄金額</div>`}
        </div>`;
    }

    let transportHtml = "";
    if(d.transport){
      transportHtml = `<div class="card"><h3>交通</h3><div class="plan-line">${d.transport}</div></div>`;
    }

    return `
      <div class="day" id="day-${d.n}">
        <div class="day-head">
          <div class="stamp"><span class="n">${String(d.n).padStart(2,"0")}</span><span class="w">${d.date}</span></div>
          <div>
            <h2>${d.title}</h2>
            <div class="date">${d.date}（${d.week}）</div>
          </div>
        </div>
        <div class="card">
          <h3>今日行程</h3>
          <div class="plan-line">${d.plan}</div>
        </div>
        ${transportHtml}
        ${ticketHtml}
        <div class="card">
          <h3>住宿</h3>
          ${hotelHtml}
        </div>
      </div>`;
  }).join("");
}

function updateCurrency(){
  document.querySelectorAll(".cur-price, .sum-value[data-twd]").forEach(el=>{
    const twd = parseFloat(el.dataset.twd);
    const jpy = parseFloat(el.dataset.jpy);
    if(isNaN(twd)) return;
    el.textContent = currency==="TWD" ? fmtTWD(twd) : fmtJPY(jpy);
  });
  document.getElementById("btnTWD").classList.toggle("on", currency==="TWD");
  document.getElementById("btnJPY").classList.toggle("on", currency==="JPY");
}

document.getElementById("btnTWD").addEventListener("click", ()=>{currency="TWD"; updateCurrency();});
document.getElementById("btnJPY").addEventListener("click", ()=>{currency="JPY"; updateCurrency();});

renderNav();
renderDays();
updateCurrency();
</script>

</body>
</html>
