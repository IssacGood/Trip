<style>
:root{
  --navy:#12293A;
  --navy-deep:#0B1C28;
  --paper:#FAF6EC;
  --paper-card:#FFFFFF;
  --reef:#2E8C8A;
  --reef-dark:#1D5C5B;
  --tile:#B5502D;
  --tile-dark:#7C3719;
  --gold:#CE9B3F;
  --line:#E4DCC8;
  --text-main:#1F2A2E;
  --text-sub:#5E6C6E;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--paper);
  color:var(--text-main);
  font-family:'Noto Sans TC',sans-serif;
  padding-bottom:60px;
}
.hero{
  background:linear-gradient(180deg,var(--navy) 0%,var(--navy-deep) 100%);
  color:#EFE7D2;
  padding:36px 20px 46px;
  position:relative;
  overflow:hidden;
}
.hero::after{
  content:"";
  position:absolute;
  left:0;right:0;bottom:-1px;height:36px;
  background:var(--paper);
  clip-path:polygon(0 60%,5% 45%,10% 60%,15% 40%,20% 60%,25% 42%,30% 60%,35% 45%,40% 60%,45% 40%,50% 60%,55% 45%,60% 60%,65% 40%,70% 60%,75% 45%,80% 60%,85% 42%,90% 60%,95% 45%,100% 60%,100% 100%,0 100%);
}
.hero-eyebrow{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  letter-spacing:2px;
  color:var(--gold);
  text-transform:uppercase;
}
.hero h1{
  font-family:'Shippori Mincho',serif;
  font-size:34px;
  font-weight:700;
  margin:8px 0 4px;
}
.hero p{
  margin:0;
  color:#B9C4C6;
  font-size:14px;
}
.hero-meta{
  display:flex;
  gap:18px;
  margin-top:18px;
  flex-wrap:wrap;
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  color:#DCCE9E;
}
.hero-meta span b{color:#fff;font-weight:500;}

.currency-toggle{
  position:sticky;
  top:0;
  z-index:20;
  background:var(--paper);
  border-bottom:1px solid var(--line);
  padding:10px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.day-nav{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding-bottom:2px;
  flex:1;
}
.day-nav::-webkit-scrollbar{height:4px;}
.day-pill{
  flex:none;
  border:1px solid var(--line);
  background:var(--paper-card);
  color:var(--text-sub);
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  padding:6px 10px;
  border-radius:20px;
  cursor:pointer;
  white-space:nowrap;
}
.day-pill.today{border-color:var(--tile);color:var(--tile-dark);font-weight:500;}
.day-pill.active{background:var(--navy);color:#EFE7D2;border-color:var(--navy);}

.cur-switch{
  flex:none;
  display:flex;
  border:1px solid var(--line);
  border-radius:20px;
  overflow:hidden;
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
}
.cur-switch button{
  border:none;
  background:var(--paper-card);
  padding:6px 12px;
  cursor:pointer;
  color:var(--text-sub);
}
.cur-switch button.on{background:var(--reef);color:#fff;}

.wrap{max-width:760px;margin:0 auto;padding:0 20px;}

.summary{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:10px;
  margin:22px 0;
}
.sum-card{
  background:var(--paper-card);
  border:1px solid var(--line);
  border-radius:12px;
  padding:14px 16px;
}
.sum-label{font-size:12px;color:var(--text-sub);}
.sum-value{font-family:'JetBrains Mono',monospace;font-size:19px;margin-top:4px;color:var(--tile-dark);}

.day{
  margin-top:26px;
  scroll-margin-top:70px;
}
.day-head{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:12px;
}
.stamp{
  flex:none;
  width:52px;height:52px;
  border-radius:50%;
  border:2px solid var(--tile);
  color:var(--tile-dark);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:'JetBrains Mono',monospace;
  transform:rotate(-4deg);
}
.stamp .n{font-size:18px;font-weight:500;line-height:1;}
.stamp .w{font-size:9px;letter-spacing:1px;}
.day-head h2{
  font-family:'Shippori Mincho',serif;
  font-size:19px;
  margin:0;
  color:var(--navy);
}
.day-head .date{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  color:var(--text-sub);
}

.card{
  background:var(--paper-card);
  border:1px solid var(--line);
  border-radius:12px;
  padding:16px 18px;
  margin-bottom:10px;
}
.card h3{
  margin:0 0 8px;
  font-size:13px;
  color:var(--reef-dark);
  display:flex;align-items:center;gap:6px;
  font-weight:500;
  text-transform:uppercase;
  letter-spacing:1px;
}
.plan-line{
  white-space:pre-line;
  font-size:14px;
  line-height:1.8;
  color:var(--text-main);
}
.activity-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
.activity{
  display:flex;
  align-items:flex-start;
  gap:10px;
  padding:10px 12px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--paper);
}
.activity-time{
  flex:none;
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--reef-dark);
  min-width:44px;
  padding-top:2px;
}
.activity-body{flex:1;min-width:0;}
.activity-name{font-size:14px;line-height:1.5;word-break:break-word;}
.activity-actions{display:flex;gap:6px;margin-top:6px;}
.act-btn{
  flex:none;
  border:1px solid var(--line);
  background:var(--paper-card);
  color:var(--text-sub);
  font-size:11px;
  padding:5px 9px;
  border-radius:8px;
  display:inline-flex;
  align-items:center;
  gap:4px;
  cursor:pointer;
  text-decoration:none;
  -webkit-tap-highlight-color:transparent;
}
.act-btn.copied{color:var(--reef-dark);border-color:var(--reef);}
@media (max-width:480px){
  .hero h1{font-size:26px;}
  .hero{padding:28px 16px 40px;}
  .wrap{padding:0 14px;}
  .day-head h2{font-size:17px;}

.hotel-name{font-size:16px;font-weight:500;color:var(--navy);margin:2px 0;}
.hotel-name a{color:var(--navy);text-decoration:none;border-bottom:1px dotted var(--navy);}
.hotel-meta{
  display:flex;
  gap:16px;
  flex-wrap:wrap;
  margin-top:8px;
  font-size:12px;
  color:var(--text-sub);
  font-family:'JetBrains Mono',monospace;
}
.hotel-meta b{color:var(--text-main);}
.price-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:12px;
  padding-top:10px;

.price-label{font-size:12px;color:var(--text-sub);}
.price-val{font-family:'JetBrains Mono',monospace;font-size:18px;color:var(--tile-dark);}
.price-sub{font-size:11px;color:var(--text-sub);font-family:'JetBrains Mono',monospace;}
.map-btn{

  gap:6px;

}
.no-hotel{font-size:13px;color:var(--text-sub);font-style:italic;}
.footnote{
  text-align:center;
  color:var(--text-sub);
  font-size:11px;
  margin-top:36px;
  font-family:'JetBrains Mono',monospace;
}

function fmtTWD(v){ return v==null ? "—" : "NT$"+Math.round(v).toLocaleString(); }
function fmtJPY(v){ return v==null ? "—" : "¥"+Math.round(v).toLocaleString(); }

let currency = "TWD";

function getJstTodayStr(){
  // Okinawa uses Japan Standard Time, UTC+9, no DST
  const utcMs = Date.now() + (new Date().getTimezoneOffset()*60000);
  const jst = new Date(utcMs + 9*3600000);
  const mm = String(jst.getMonth()+1).padStart(2,"0");
  const dd = String(jst.getDate()).padStart(2,"0");
  return mm+"/"+dd;
}

function renderNav(){
  const nav = document.getElementById("dayNav");
  const todayStr = getJstTodayStr();
  nav.innerHTML = days.map(d=>{
    const isToday = d.date === todayStr;
    return `<button class="day-pill${isToday?" today":""}" data-target="day-${d.n}">${d.date} ${d.week}${isToday?" ・今天":""}</button>`;
  }).join("");
  nav.querySelectorAll(".day-pill").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      document.querySelectorAll(".day-pill").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById(btn.dataset.target).scrollIntoView({behavior:"smooth", block:"start"});
    });
  });
  const todayBtn = nav.querySelector(".day-pill.today");
  if(todayBtn){
    todayBtn.classList.add("active");
    setTimeout(()=>todayBtn.scrollIntoView({inline:"center", block:"nearest"}), 300);
  }
}

function copyText(text, btn){
  navigator.clipboard.writeText(text).then(()=>{
    const original = btn.innerHTML;
    btn.classList.add("copied");
    btn.innerHTML = "已複製";
    setTimeout(()=>{ btn.classList.remove("copied"); btn.innerHTML = original; }, 1400);
  });
}

    const isToday = d.date === todayStr;

    const activityHtml = `<ul class="activity-list">${d.activities.map((a,i)=>{
      const searchQuery = encodeURIComponent(a.name + " 沖繩 Okinawa");
      return `
        <li class="activity">
          ${a.time ? `<div class="activity-time">${a.time}</div>` : `<div class="activity-time"></div>`}
          <div class="activity-body">
            <div class="activity-name" data-name="${a.name.replace(/"/g,'&quot;')}">${a.name}</div>
            <div class="activity-actions">
              <button class="act-btn" data-copy="${a.name.replace(/"/g,'&quot;')}" aria-label="複製名稱">複製名稱</button>
              <a class="act-btn" href="https://www.google.com/search?q=${searchQuery}" target="_blank" rel="noopener">查詢</a>
              <a class="act-btn" href="https://www.google.com/maps/search/?api=1&query=${searchQuery}" target="_blank" rel="noopener">地圖</a>
            </div>
          </div>
        </li>`;
    }).join("")}</ul>`;

    let hotelHtml = `<div class="no-hotel">本日無新入住飯店（延續前一晚住宿或當日返程）</div>`;
    if(d.hotel){
      const mapQuery = encodeURIComponent(d.hotel.nameEn + " " + d.hotel.area + " Okinawa");
      hotelHtml = `
        <div class="hotel-name">${d.hotel.name}<br><span style="font-size:12px;color:var(--text-sub);font-weight:400;">${d.hotel.nameEn}</span></div>
        <div class="hotel-meta">
          <span>入住 <b>${d.hotel.checkin}</b></span>
          <span>退房 <b>${d.hotel.checkout}</b></span>
          <span>區域 <b>${d.hotel.area}</b></span>
        </div>
        <div class="activity-actions" style="margin-top:10px;">
          <button class="act-btn" data-copy="${d.hotel.nameEn.replace(/"/g,'&quot;')}" aria-label="複製飯店名稱">複製名稱</button>
          <a class="act-btn" href="https://www.google.com/maps/search/?api=1&query=${mapQuery}" target="_blank" rel="noopener">在 Google 地圖開啟位置</a>
        </div>
        <div class="price-row">
          <div>
            <div class="price-label">房價估算</div>
            <div class="price-sub">＝ ${fmtTWD(d.hotel.twd)} ｜ ${fmtJPY(d.hotel.jpy)}</div>
          </div>
          <div class="price-val cur-price" data-twd="${d.hotel.twd}" data-jpy="${d.hotel.jpy}">${currency==="TWD"?fmtTWD(d.hotel.twd):fmtJPY(d.hotel.jpy)}</div>
        </div>`;
    }

    let ticketHtml = "";
    if(d.ticket){
      ticketHtml = `
        <div class="card">
          <h3>門票 / 餐飲估價</h3>
          <div class="plan-line">${d.ticket.label}</div>
          ${d.ticket.twd!=null ? `<div class="price-row"><div class="price-label">估算</div><div class="price-val cur-price" data-twd="${d.ticket.twd}" data-jpy="${d.ticket.jpy}">${currency==="TWD"?fmtTWD(d.ticket.twd):fmtJPY(d.ticket.jpy)}</div></div>` : `<div class="price-sub" style="margin-top:8px;">尚未記錄金額</div>`}
        </div>`;
    }

    let transportHtml = "";
    if(d.transport){
      transportHtml = `<div class="card"><h3>交通</h3><div class="plan-line">${d.transport}</div></div>`;
    }

    return `
      <div class="day" id="day-${d.n}">
        <div class="day-head">
          <div class="stamp" style="${isToday?'border-color:var(--reef);color:var(--reef-dark);':''}"><span class="n">${String(d.n).padStart(2,"0")}</span><span class="w">${d.date}</span></div>
          <div>
            <h2>${d.title}${isToday?' <span style="font-size:11px;color:var(--reef-dark);border:1px solid var(--reef);border-radius:10px;padding:2px 8px;vertical-align:middle;font-family:\'JetBrains Mono\',monospace;">今天</span>':''}</h2>
            <div class="date">${d.date}（${d.week}）· 日本沖繩時間</div>
          </div>
        </div>
        <div class="card">
          <h3>今日行程</h3>
          ${activityHtml}
        </div>
        ${transportHtml}
        ${ticketHtml}
        <div class="card">
          <h3>住宿</h3>
          ${hotelHtml}
        </div>
      </div>`;
  }).join("");

  root.querySelectorAll("[data-copy]").forEach(btn=>{
    btn.addEventListener("click", ()=> copyText(btn.dataset.copy, btn));
  });
}

function updateCurrency(){
  document.querySelectorAll(".cur-price, .sum-value[data-twd]").forEach(el=>{
    const twd = parseFloat(el.dataset.twd);
    const jpy = parseFloat(el.dataset.jpy);
    if(isNaN(twd)) return;
    el.textContent = currency==="TWD" ? fmtTWD(twd) : fmtJPY(jpy);
  });
  document.getElementById("btnTWD").classList.toggle("on", currency==="TWD");
  document.getElementById("btnJPY").classList.toggle("on", currency==="JPY");
}

document.getElementById("btnTWD").addEventListener("click", ()=>{currency="TWD"; updateCurrency();});
document.getElementById("btnJPY").addEventListener("click", ()=>{currency="JPY"; updateCurrency();});

renderNav();
renderDays();
updateCurrency();
</script>

</body>
</html>
